<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="infraGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="beamGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#infraGrad)" />

  <!-- Blueprint Grid -->
  <g stroke="rgba(99, 102, 241, 0.15)" stroke-width="1">
    <line x1="0" y1="50" x2="800" y2="50" />
    <line x1="0" y1="150" x2="800" y2="150" />
    <line x1="0" y1="250" x2="800" y2="250" />
    <line x1="0" y1="350" x2="800" y2="350" />
    <line x1="100" y1="0" x2="100" y2="450" />
    <line x1="200" y1="0" x2="200" y2="450" />
    <line x1="300" y1="0" x2="300" y2="450" />
    <line x1="400" y1="0" x2="400" y2="450" />
    <line x1="500" y1="0" x2="500" y2="450" />
    <line x1="600" y1="0" x2="600" y2="450" />
    <line x1="700" y1="0" x2="700" y2="450" />
  </g>

  <!-- High-Rise Tower G20 Wireframe / Construction Silhouette -->
  <!-- Tower Base -->
  <rect x="280" y="80" width="240" height="340" fill="#1e293b" stroke="#6366f1" stroke-width="2.5" />
  <!-- Floors -->
  <g stroke="#475569" stroke-width="1.5">
    <line x1="280" y1="120" x2="520" y2="120" />
    <line x1="280" y1="160" x2="520" y2="160" />
    <line x1="280" y1="200" x2="520" y2="200" />
    <line x1="280" y1="240" x2="520" y2="240" />
    <line x1="280" y1="280" x2="520" y2="280" />
    <line x1="280" y1="320" x2="520" y2="320" />
    <line x1="280" y1="360" x2="520" y2="360" />
  </g>
  <!-- Vertical Structural Columns -->
  <line x1="340" y1="80" x2="340" y2="420" stroke="#818cf8" stroke-width="2" />
  <line x1="400" y1="80" x2="400" y2="420" stroke="#818cf8" stroke-width="2" />
  <line x1="460" y1="80" x2="460" y2="420" stroke="#818cf8" stroke-width="2" />

  <!-- Construction Crane on top -->
  <line x1="400" y1="80" x2="400" y2="35" stroke="#f59e0b" stroke-width="3" />
  <line x1="330" y1="45" x2="490" y2="45" stroke="#f59e0b" stroke-width="3" />
  <line x1="370" y1="45" x2="400" y2="25" stroke="#f59e0b" stroke-width="2" />
  <line x1="400" y1="25" x2="430" y2="45" stroke="#f59e0b" stroke-width="2" />
  <line x1="470" y1="45" x2="470" y2="70" stroke="#d97706" stroke-width="1.5" stroke-dasharray="3,3" />

  <!-- Badge -->
  <rect x="50" y="45" width="250" height="42" rx="8" fill="rgba(30, 27, 75, 0.85)" stroke="#6366f1" stroke-width="1.5" />
  <text x="65" y="71" font-family="sans-serif" font-size="13" font-weight="bold" fill="#a5b4fc">Civil & Site Execution</text>
  <text x="50" y="115" font-family="sans-serif" font-size="14" font-weight="600" fill="#e2e8f0">Golden Key G20 High-Rise</text>
</svg>
