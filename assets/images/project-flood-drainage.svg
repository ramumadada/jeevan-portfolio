<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="gisGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <linearGradient id="floodGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="#031f18" />

  <!-- Topographic Contour Lines -->
  <g stroke="#059669" stroke-width="1.5" fill="none" opacity="0.35">
    <ellipse cx="400" cy="225" rx="360" ry="190" />
    <ellipse cx="400" cy="225" rx="280" ry="140" />
    <ellipse cx="400" cy="225" rx="200" ry="95" />
    <ellipse cx="400" cy="225" rx="120" ry="50" />
  </g>

  <!-- Meandering River Channel / Flood Inundation Zone -->
  <path d="M 0 100 C 180 120, 240 280, 420 220 C 580 160, 680 340, 800 320" fill="none" stroke="#0284c7" stroke-width="48" stroke-linecap="round" opacity="0.3" />
  <path d="M 0 100 C 180 120, 240 280, 420 220 C 580 160, 680 340, 800 320" fill="none" stroke="#38bdf8" stroke-width="20" stroke-linecap="round" />

  <!-- Drainage Network Nodes (SewerGEMS / InfoWorks ICM) -->
  <g fill="#10b981" stroke="#ffffff" stroke-width="2">
    <circle cx="160" cy="180" r="8" />
    <circle cx="280" cy="140" r="8" />
    <circle cx="340" cy="300" r="8" />
    <circle cx="490" cy="160" r="8" />
    <circle cx="560" cy="270" r="8" />
    <circle cx="680" cy="230" r="8" />
  </g>

  <!-- Connecting Pipes -->
  <g stroke="#10b981" stroke-width="3" stroke-dasharray="4,4">
    <line x1="160" y1="180" x2="280" y2="140" />
    <line x1="280" y1="140" x2="420" y2="220" />
    <line x1="340" y1="300" x2="420" y2="220" />
    <line x1="490" y1="160" x2="560" y2="270" />
    <line x1="560" y1="270" x2="680" y2="230" />
  </g>

  <!-- Hydraulic Info Box -->
  <rect x="50" y="45" width="280" height="42" rx="8" fill="rgba(6, 78, 59, 0.85)" stroke="#10b981" stroke-width="1.5" />
  <text x="65" y="71" font-family="sans-serif" font-size="13" font-weight="bold" fill="#34d399">HEC-RAS & InfoWorks ICM</text>
  <text x="50" y="115" font-family="sans-serif" font-size="14" font-weight="600" fill="#e2e8f0">Urban Drainage & Flood Analysis</text>
</svg>
