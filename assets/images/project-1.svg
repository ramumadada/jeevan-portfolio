<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="p1Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="barGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#p1Grad)" />

  <!-- Window Frame -->
  <rect x="60" y="45" width="680" height="360" rx="16" fill="#111827" stroke="#374151" stroke-width="2" />
  
  <!-- Window Top Bar -->
  <rect x="60" y="45" width="680" height="40" rx="16" fill="#1f2937" />
  <circle cx="85" cy="65" r="6" fill="#ef4444" />
  <circle cx="105" cy="65" r="6" fill="#f59e0b" />
  <circle cx="125" cy="65" r="6" fill="#10b981" />
  <text x="400" y="70" font-family="sans-serif" font-size="13" fill="#9ca3af" text-anchor="middle">analytics.dashboard.app</text>

  <!-- Metric Cards -->
  <rect x="90" y="110" width="180" height="70" rx="10" fill="#1e293b" />
  <text x="110" y="135" font-family="sans-serif" font-size="12" fill="#94a3b8">Total Revenue</text>
  <text x="110" y="165" font-family="sans-serif" font-size="20" font-weight="bold" fill="#38bdf8">$48,250</text>

  <rect x="290" y="110" width="180" height="70" rx="10" fill="#1e293b" />
  <text x="310" y="135" font-family="sans-serif" font-size="12" fill="#94a3b8">Active Sessions</text>
  <text x="310" y="165" font-family="sans-serif" font-size="20" font-weight="bold" fill="#a855f7">12,480</text>

  <rect x="490" y="110" width="220" height="70" rx="10" fill="#1e293b" />
  <text x="510" y="135" font-family="sans-serif" font-size="12" fill="#94a3b8">Conversion Rate</text>
  <text x="510" y="165" font-family="sans-serif" font-size="20" font-weight="bold" fill="#34d399">4.8% (+1.2%)</text>

  <!-- Bar Chart Illustration -->
  <rect x="90" y="200" width="620" height="180" rx="12" fill="#1e293b" />
  <g fill="url(#barGrad)">
    <rect x="130" y="300" width="35" height="60" rx="4" />
    <rect x="185" y="270" width="35" height="90" rx="4" />
    <rect x="240" y="250" width="35" height="110" rx="4" />
    <rect x="295" y="230" width="35" height="130" rx="4" />
    <rect x="350" y="280" width="35" height="80" rx="4" />
    <rect x="405" y="240" width="35" height="120" rx="4" />
    <rect x="460" y="220" width="35" height="140" rx="4" />
    <rect x="515" y="260" width="35" height="100" rx="4" />
    <rect x="570" y="235" width="35" height="125" rx="4" />
    <rect x="625" y="210" width="35" height="150" rx="4" fill="#38bdf8" />
  </g>
</svg>
