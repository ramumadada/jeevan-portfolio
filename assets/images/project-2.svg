<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="p2Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022c22" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#p2Grad)" />

  <!-- Window Frame -->
  <rect x="60" y="45" width="680" height="360" rx="16" fill="#064e3b" opacity="0.4" stroke="#059669" stroke-width="2" />
  
  <!-- Header Bar -->
  <rect x="60" y="45" width="680" height="40" rx="16" fill="#065f46" />
  <circle cx="85" cy="65" r="6" fill="#ef4444" />
  <circle cx="105" cy="65" r="6" fill="#f59e0b" />
  <circle cx="125" cy="65" r="6" fill="#10b981" />
  <text x="400" y="70" font-family="sans-serif" font-size="13" fill="#a7f3d0" text-anchor="middle">store.modern-shop.com</text>

  <!-- Product Grid Cards -->
  <g transform="translate(100, 115)">
    <!-- Card 1 -->
    <rect x="0" y="0" width="170" height="250" rx="12" fill="#042f2e" stroke="#10b981" stroke-width="1.5" />
    <rect x="15" y="15" width="140" height="110" rx="8" fill="#115e59" />
    <circle cx="85" cy="70" r="30" fill="url(#cardGrad)" opacity="0.8" />
    <rect x="15" y="145" width="90" height="12" rx="4" fill="#99f6e4" />
    <rect x="15" y="165" width="130" height="8" rx="4" fill="#5eead4" opacity="0.5" />
    <rect x="15" y="200" width="70" height="24" rx="6" fill="#10b981" />

    <!-- Card 2 -->
    <rect x="210" y="0" width="170" height="250" rx="12" fill="#042f2e" stroke="#10b981" stroke-width="1.5" />
    <rect x="225" y="15" width="140" height="110" rx="8" fill="#115e59" />
    <polygon points="295,45 330,95 260,95" fill="url(#cardGrad)" opacity="0.8" />
    <rect x="225" y="145" width="90" height="12" rx="4" fill="#99f6e4" />
    <rect x="225" y="165" width="130" height="8" rx="4" fill="#5eead4" opacity="0.5" />
    <rect x="225" y="200" width="70" height="24" rx="6" fill="#10b981" />

    <!-- Card 3 -->
    <rect x="420" y="0" width="170" height="250" rx="12" fill="#042f2e" stroke="#10b981" stroke-width="1.5" />
    <rect x="435" y="15" width="140" height="110" rx="8" fill="#115e59" />
    <rect x="475" y="50" width="60" height="45" rx="6" fill="url(#cardGrad)" opacity="0.8" />
    <rect x="435" y="145" width="90" height="12" rx="4" fill="#99f6e4" />
    <rect x="435" y="165" width="130" height="8" rx="4" fill="#5eead4" opacity="0.5" />
    <rect x="435" y="200" width="70" height="24" rx="6" fill="#10b981" />
  </g>
</svg>
