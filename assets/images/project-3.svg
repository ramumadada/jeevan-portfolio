<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="p3Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#180e29" />
      <stop offset="100%" stop-color="#2a1240" />
    </linearGradient>
    <linearGradient id="nodeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#p3Grad)" />

  <!-- Window Frame -->
  <rect x="60" y="45" width="680" height="360" rx="16" fill="#1e112a" stroke="#4c1d95" stroke-width="2" />
  
  <!-- Header Bar -->
  <rect x="60" y="45" width="680" height="40" rx="16" fill="#2e1065" />
  <circle cx="85" cy="65" r="6" fill="#ef4444" />
  <circle cx="105" cy="65" r="6" fill="#f59e0b" />
  <circle cx="125" cy="65" r="6" fill="#10b981" />
  <text x="400" y="70" font-family="sans-serif" font-size="13" fill="#fbcfe8" text-anchor="middle">automation.pipeline.dev</text>

  <!-- Flowchart Diagram -->
  <g stroke="#a855f7" stroke-width="3" stroke-dasharray="6,6">
    <line x1="200" y1="210" x2="330" y2="210" />
    <line x1="470" y1="210" x2="600" y2="210" />
    <line x1="400" y1="250" x2="400" y2="310" />
  </g>

  <!-- Node 1: Webhook Trigger -->
  <rect x="110" y="170" width="140" height="80" rx="12" fill="#3b0764" stroke="#d946ef" stroke-width="2" />
  <text x="180" y="205" font-family="sans-serif" font-size="13" font-weight="bold" fill="#fdf4ff" text-anchor="middle">Webhook Event</text>
  <text x="180" y="225" font-family="sans-serif" font-size="11" fill="#e879f9" text-anchor="middle">HTTP POST (200)</text>

  <!-- Node 2: Processing Service -->
  <rect x="330" y="160" width="140" height="100" rx="14" fill="url(#nodeGrad)" stroke="#fda4af" stroke-width="2" />
  <text x="400" y="205" font-family="sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">FastAPI Core</text>
  <text x="400" y="225" font-family="sans-serif" font-size="11" fill="#ffe4e6" text-anchor="middle">Data Transform</text>
  <text x="400" y="243" font-family="sans-serif" font-size="10" fill="#ffffff" opacity="0.9" text-anchor="middle">Worker Queues</text>

  <!-- Node 3: Database & Cloud Sync -->
  <rect x="550" y="170" width="140" height="80" rx="12" fill="#3b0764" stroke="#d946ef" stroke-width="2" />
  <text x="620" y="205" font-family="sans-serif" font-size="13" font-weight="bold" fill="#fdf4ff" text-anchor="middle">Cloud Storage</text>
  <text x="620" y="225" font-family="sans-serif" font-size="11" fill="#e879f9" text-anchor="middle">Synced in 12ms</text>

  <!-- Node 4: Alerts / Notification -->
  <rect x="330" y="310" width="140" height="60" rx="10" fill="#2e1065" stroke="#a855f7" stroke-width="1.5" />
  <text x="400" y="345" font-family="sans-serif" font-size="12" font-weight="bold" fill="#e9d5ff" text-anchor="middle">Discord Alert</text>
</svg>
