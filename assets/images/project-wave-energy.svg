<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="oceanGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#082f49" />
      <stop offset="60%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#0c4a6e" />
    </linearGradient>
    <linearGradient id="waveEnergyGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
  </defs>

  <!-- Sky / Background -->
  <rect width="800" height="450" fill="#0b1727" />

  <!-- Grid overlay for numerical simulation -->
  <g stroke="rgba(56, 189, 248, 0.12)" stroke-width="1">
    <line x1="0" y1="80" x2="800" y2="80" />
    <line x1="0" y1="160" x2="800" y2="160" />
    <line x1="0" y1="240" x2="800" y2="240" />
    <line x1="0" y1="320" x2="800" y2="320" />
    <line x1="100" y1="0" x2="100" y2="450" />
    <line x1="200" y1="0" x2="200" y2="450" />
    <line x1="300" y1="0" x2="300" y2="450" />
    <line x1="400" y1="0" x2="400" y2="450" />
    <line x1="500" y1="0" x2="500" y2="450" />
    <line x1="600" y1="0" x2="600" y2="450" />
    <line x1="700" y1="0" x2="700" y2="450" />
  </g>

  <!-- OWC Chamber Structure (Modular Multi-Chamber) -->
  <path d="M 460 120 L 720 120 L 720 380 L 460 380 Z" fill="#1e293b" stroke="#38bdf8" stroke-width="3" />
  <path d="M 520 180 L 660 180 L 660 380 L 520 380 Z" fill="#0f172a" stroke="#64748b" stroke-width="2" />
  <!-- Air Turbine Orifice -->
  <rect x="565" y="90" width="50" height="30" rx="4" fill="#0284c7" stroke="#38bdf8" stroke-width="2" />
  <path d="M 575 105 L 605 105" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
  <text x="590" y="80" font-family="sans-serif" font-size="12" fill="#38bdf8" text-anchor="middle">Air Turbine Ducts</text>

  <!-- Water Surface & Dynamics -->
  <path d="M 0 260 C 80 230, 160 290, 240 260 C 320 230, 400 280, 480 255 C 540 235, 590 280, 650 250 L 650 450 L 0 450 Z" fill="url(#oceanGrad)" opacity="0.8" />
  <path d="M 0 270 C 90 250, 180 300, 270 270 C 360 240, 440 295, 520 265 L 800 265 L 800 450 L 0 450 Z" fill="url(#oceanGrad)" opacity="0.6" />

  <!-- Velocity Vector Field / CFD Streamlines -->
  <g stroke="url(#waveEnergyGrad)" stroke-width="2" stroke-linecap="round" fill="none">
    <path d="M 80 210 Q 140 190 200 220" />
    <path d="M 180 190 Q 260 170 340 200" />
    <path d="M 320 180 Q 400 150 480 190" />
    <path d="M 540 220 Q 565 170 590 130" stroke-width="3" stroke="#f43f5e" />
    <path d="M 590 130 Q 615 170 640 220" stroke-width="3" stroke="#f43f5e" />
  </g>

  <!-- CFD Label Badge -->
  <rect x="60" y="45" width="260" height="42" rx="8" fill="rgba(15, 23, 42, 0.85)" stroke="#0284c7" stroke-width="1.5" />
  <text x="75" y="71" font-family="sans-serif" font-size="13" font-weight="bold" fill="#38bdf8">ANSYS Fluent | CFD Simulation</text>
  <text x="75" y="115" font-family="sans-serif" font-size="14" font-weight="600" fill="#e2e8f0">Multi-Chamber OWC Wave Energy</text>
</svg>
